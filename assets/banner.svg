<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <!-- Dynamic Dynamic Tech Grid / Network Nodes (Background Layer) -->
  <g opacity="0.25">
    <!-- Grid Lines -->
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#475569" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M 150,0 L 150,300 M 300,0 L 300,300 M 450,0 L 450,300 M 600,0 L 600,300 M 750,0 L 750,300 M 900,0 L 900,300 M 1050,0 L 1050,300" stroke="#475569" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Animated pulse connections -->
    <path d="M 100 200 L 250 80 L 400 220 L 600 100 L 800 240 L 950 90 L 1100 210" stroke="url(#accent)" stroke-width="2" fill="none">
      <animate attributeName="stroke-dashoffset" values="1000;0" dur="15s" repeatCount="indefinite" />
      <animate attributeName="stroke-dasharray" values="10,15;20,10;10,15" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Pulsing Nodes -->
    <circle cx="250" cy="80" r="6" fill="#818cf8">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="100" r="8" fill="#c084fc">
      <animate attributeName="r" values="5;10;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="90" r="6" fill="#f472b6">
      <animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card Background Glow behind text -->
  <rect x="80" y="45" width="1040" height="210" rx="12" fill="url(#glow)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Foreground Content (Title and Subtitle) -->
  <g filter="url(#shadow)" text-anchor="middle">
    <!-- Icon / Badge Top -->
    <rect x="520" y="65" width="160" height="28" rx="14" fill="url(#accent)" opacity="0.9"/>
    <text x="600" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="1.5">AI GOVERNANCE &amp; MRM</text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Model Risk Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">
      Curated SaaS Platforms, Enterprise AI Governance &amp; Open-Source MRM Ecosystem
    </text>

    <!-- Feature Tags -->
    <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      🛡️ EU AI Act &amp; NIST RMF Compliance  •  🔍 Explainability &amp; Drift  •  ⚖️ Fairness &amp; Bias Mitigation
    </text>
  </g>
</svg>
